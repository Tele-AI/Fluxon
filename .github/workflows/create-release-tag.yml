name: create_release_tag

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: create-release-tag
  cancel-in-progress: false

jobs:
  create-tag:
    name: Validate release commit and create tag
    runs-on: ubuntu-latest
    steps:
      - name: Check out selected release commit
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve release metadata from the repository
        id: release_meta
        run: python3 fluxon_release/resolve_release_meta.py --github-output "$GITHUB_OUTPUT"

      - name: Validate release metadata and successful commit CI
        id: preflight
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_NOTES_FILE: ${{ steps.release_meta.outputs.release_notes_file }}
          RELEASE_TAG: ${{ steps.release_meta.outputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+[A-Za-z0-9.+-]*$ ]]; then
            echo "Invalid release tag: $RELEASE_TAG" >&2
            exit 1
          fi
          if [[ "$GITHUB_REF" != "refs/heads/$DEFAULT_BRANCH" ]]; then
            echo "create_release_tag must run from the default branch: expected refs/heads/$DEFAULT_BRANCH, got $GITHUB_REF" >&2
            exit 1
          fi
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release tag already exists: $RELEASE_TAG" >&2
            exit 1
          fi

          test -f "$RELEASE_NOTES_FILE"

          ci_run_id="$(
            gh api \
              --method GET \
              "repos/$GITHUB_REPOSITORY/actions/workflows/all_test.yml/runs" \
              -f branch="$DEFAULT_BRANCH" \
              -f event=push \
              -f status=success \
              -f per_page=100 |
              jq -r \
                --arg branch "$DEFAULT_BRANCH" \
                --arg sha "$GITHUB_SHA" \
                '[.workflow_runs[] | select(.head_branch == $branch and .head_sha == $sha)][0].id // empty'
          )"
          if [[ -z "$ci_run_id" ]]; then
            echo "No successful default-branch ci_2_virt_node run found for $GITHUB_SHA" >&2
            exit 1
          fi

          ci_artifacts_json="$(
            gh api \
              "repos/$GITHUB_REPOSITORY/actions/runs/$ci_run_id/artifacts?per_page=100"
          )"
          for required_artifact in \
            "fluxon-ci-release-$GITHUB_SHA" \
            "release-ci-provenance-$GITHUB_SHA"; do
            if ! jq -e \
              --arg name "$required_artifact" \
              'any(.artifacts[]; .name == $name and .expired == false)' \
              <<<"$ci_artifacts_json" >/dev/null; then
              echo "Validated CI artifact is missing or expired: $required_artifact (run $ci_run_id)" >&2
              exit 1
            fi
          done

          echo "ci_run_id=$ci_run_id" >> "$GITHUB_OUTPUT"

      - name: Create release tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release_meta.outputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail
          gh api \
            --method POST \
            "repos/$GITHUB_REPOSITORY/git/refs" \
            -f ref="refs/tags/$RELEASE_TAG" \
            -f sha="$GITHUB_SHA"

      - name: Start release workflow with validated CI
        env:
          CI_RUN_ID: ${{ steps.preflight.outputs.ci_run_id }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release_meta.outputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail
          dispatch_payload="$(
            jq -n \
              --arg ci_run_id "$CI_RUN_ID" \
              --arg release_tag "$RELEASE_TAG" \
              --arg source_sha "$GITHUB_SHA" \
              '{
                event_type: "publish_release",
                client_payload: {
                  ci_run_id: $ci_run_id,
                  release_tag: $release_tag,
                  source_sha: $source_sha
                }
              }'
          )"
          for attempt in 1 2 3; do
            if gh api \
              --method POST \
              "repos/$GITHUB_REPOSITORY/dispatches" \
              --input - <<<"$dispatch_payload"; then
              exit 0
            fi
            if [[ "$attempt" == "3" ]]; then
              echo "Failed to dispatch publish_release after $attempt attempts" >&2
              exit 1
            fi
            sleep "$((attempt * 2))"
          done

      - name: Write tag summary
        env:
          CI_RUN_ID: ${{ steps.preflight.outputs.ci_run_id }}
          RELEASE_TAG: ${{ steps.release_meta.outputs.release_tag }}
        shell: bash
        run: |
          {
            echo "## Release tag created"
            echo
            echo "- Tag: \`$RELEASE_TAG\`"
            echo "- Commit: \`$GITHUB_SHA\`"
            echo "- Validated commit CI: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$CI_RUN_ID"
            echo "- Release workflow: dispatched with the validated default-branch CI"
            echo "- Next: wait for release-readiness review."
          } >> "$GITHUB_STEP_SUMMARY"
